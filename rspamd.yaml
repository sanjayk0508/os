package:
  name: rspamd
  version: "3.12.1"
  epoch: 0
  description: "Rapid spam filtering system"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - ca-certificates-bundle
      - coreutils
      - findutils
      - glib
      - libarchive
      - libevent
      - libicu77
      - libmagic
      - libsodium
      - luajit
      - openssl
      - pcre2
      - sqlite-libs
      - wolfi-baselayout
      - zlib

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - coreutils
      - findutils
      - glib-dev
      - icu-dev
      - libarchive-dev
      - libsodium-dev
      - luajit-dev
      - openssl-dev
      - pcre2-dev
      - perl
      - ragel-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rspamd/rspamd
      tag: ${{package.version}}
      expected-commit: 6dbfca2fa06e1856a57fce7a6c90d5e0d0406b6a

  - uses: cmake/configure
    with:
      opts: |
        -DENABLE_PCRE2=ON \
        -DENABLE_LUAJIT=ON \
        -DINSTALL_WEBUI=OFF \
        -DINSTALL_EXAMPLES=OFF

  - uses: cmake/build

  - uses: cmake/install

  - runs: |
      # Copy configuration files from where cmake installed them to where we want them
      mkdir -p "${{targets.destdir}}"/etc/rspamd

      # Debug: Check what cmake installed
      echo "=== Checking what cmake installed ==="
      ls -la "${{targets.destdir}}"/usr/etc/rspamd/
      echo "=== Copying main config ==="

      # Copy main rspamd.conf to /etc/rspamd/
      if [ -f "${{targets.destdir}}"/usr/etc/rspamd/rspamd.conf ]; then
          echo "Found rspamd.conf installed by cmake, copying to /etc/rspamd/"
          cp "${{targets.destdir}}"/usr/etc/rspamd/rspamd.conf "${{targets.destdir}}"/etc/rspamd/
      else
          echo "ERROR: rspamd.conf not found in cmake install output!"
          exit 1
      fi

      # Set proper permissions
      chmod 644 "${{targets.destdir}}"/etc/rspamd/rspamd.conf

      # Create required directories
      install -d -m 755 "${{targets.destdir}}"/var/lib/rspamd
      install -d -m 755 "${{targets.destdir}}"/var/log/rspamd
      install -d -m 755 "${{targets.destdir}}"/run/rspamd

  - uses: strip

update:
  enabled: true
  github:
    identifier: rspamd/rspamd
    use-tag: true
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - bash
        - coreutils
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Basic binary check"
      runs: |
        rspamd --version | grep -F -e "${{package.version}}"
        rspamc --help | grep -F -e "run rspamc client"
        rspamadm --version | grep -F -e "${{package.version}}"
    - name: "Test rspamadm administrative tools"
      runs: |
        rspamadm configtest | grep -F -e "syntax OK"
        rspamadm pw -p test123 | grep -q "\\$"
        rspamadm confighelp -k actions | grep -F -e "Configuration element: .actions"
