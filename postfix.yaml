package:
  name: postfix
  version: "4.4.0"
  epoch: 7
  description: Secure and fast drop-in replacement for Sendmail (MTA) with Rspamd integration
  copyright:
    - license: IPL-1.0 OR EPL-2.0
  checks:
    disabled:
      - setuidgid
  dependencies:
    runtime:
      - bash
      - busybox
      - coreutils
      - cronie
      - findutils
      - glibc
      - grep
      - krb5-libs
      - merged-usrsbin
      - netcat-openbsd
      - rspamd@local
      - rsyslog
      - sasl-xoauth2
      - sed
      - shadow
      - supervisor
      - wolfi-baselayout

environment:
  contents:
    repositories:
      - '@local /work/packages'
      - https://packages.wolfi.dev/os
    keyring:
      - local-melange.rsa.pub
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - cyrus-sasl-dev
      - icu-dev
      - krb5-dev
      - libnsl-dev
      - linux-headers
      - lmdb-dev
      - m4
      - mariadb-connector-c-dev
      - openldap-dev
      - openssl-dev
      - pcre2-dev
      - perl
      - postgresql-dev
      - rspamd@local
      - rsyslog
      - sasl-xoauth2-dev
      - shadow
      - sqlite-dev
      - supervisor

data:
  - name: _subpackages
    items:
      ldap:
      mysql:
      pcre:
      pgsql:
      sqlite:

pipeline:
  # Get the upstream docker-postfix repository for scripts and configs
  - uses: git-checkout
    with:
      repository: https://github.com/bokysan/docker-postfix
      tag: v${{package.version}}
      expected-commit: 5113756b0836cc27e928040b2aa9762e820dc71b

  # Get Postfix source tarball (scripts come from GitHub, but source code only available via tarball)
  - uses: fetch
    with:
      expected-sha256: e3cec05d91b6d2958ecd6ea9045faa35f79c5b0e228b975ace46ad2afe812053
      uri: https://de.postfix.org/ftpmirror/official/postfix-3.10.3.tar.gz

  - runs: |
      _mvline() {
        local regex="$1"
        local outfile="$3.d/$2"
        local infile="$3"
        sed -i -E -e "\|$regex|{
      w $outfile
      d
      }" "$infile"
      }

      # Initialize variables for compile-time flags and auxiliary libraries
      ccargs="-DHAS_SHL_LOAD"
      auxlibs="$LDFLAGS"

      # Add Berkeley-DB settings
      ccargs="$ccargs -DNO_DB"

      # Add PCRE2 settings
      ccargs="$ccargs -DHAS_PCRE=2 $(pcre2-config --cflags)"

      # Add SSL/TLS settings
      ccargs="$ccargs -DUSE_TLS"
      auxlibs="$auxlibs -lssl -lcrypto"

      # Add Dovecot SASL settings
      ccargs="$ccargs -DUSE_SASL_AUTH -DDEF_SASL_SERVER=\\\"dovecot\\\""

      # Add Cyrus SASL settings
      ccargs="$ccargs -DUSE_SASL_AUTH -DUSE_CYRUS_SASL -I/usr/include/sasl"
      auxlibs="$auxlibs -lsasl2"

      # Add PostgreSQL settings
      ccargs="$ccargs -DHAS_PGSQL $(pkg-config --cflags libpq)"

      # Add MySQL settings
      ccargs="$ccargs -DHAS_MYSQL $(mysql_config --include)"

      # Add LDAP settings
      ccargs="$ccargs -DHAS_LDAP -DUSE_LDAP_SASL"

      # Add SQLite settings
      ccargs="$ccargs -DHAS_SQLITE $(pkg-config --cflags sqlite3)"

      # Add LMDB settings and make it default
      ccargs="$ccargs -DHAS_LMDB $(pkg-config --cflags lmdb) -DDEF_DB_TYPE=\\\"lmdb\\\""

      # Fix build error with gcc 15.
      ccargs="$ccargs -std=gnu17"

      mkdir -p "${{targets.contextdir}}"/usr/bin
      mkdir -p "${{targets.contextdir}}"/etc/postfix
      mkdir -p "${{targets.contextdir}}"/usr/share/man
      mkdir -p "${{targets.contextdir}}"/usr/share/man/man1
      mkdir -p "${{targets.contextdir}}"/usr/share/doc/postfix/defaults
      mkdir -p "${{targets.contextdir}}"/usr/share/doc/postfix/readme
      mkdir -p "${{targets.contextdir}}"/usr/share/licenses/postfix

      # compile
      make DEBUG="" \
      	OPT="$CFLAGS" \
      	CCARGS="$ccargs" \
      	AUXLIBS="$auxlibs" \
      	AUXLIBS_LDAP="-lldap -llber" \
      	AUXLIBS_MYSQL="$(mysql_config --libs)" \
      	AUXLIBS_PCRE="$(pkg-config --libs libpcre2-8)" \
      	AUXLIBS_PGSQL="$(pkg-config --libs libpq)" \
      	AUXLIBS_SQLITE="$(pkg-config --libs sqlite3)" \
      	AUXLIBS_LMDB="$(pkg-config --libs lmdb)" \
      	config_directory=/etc/postfix \
      	meta_directory=/etc/postfix \
      	daemon_directory=/usr/libexec/postfix \
      	shlib_directory=/usr/lib/postfix \
      	SHLIB_RPATH="-Wl,-rpath,/usr/lib/postfix" \
      	sendmail_path=/usr/bin/sendmail \
      	dynamicmaps=yes \
      	shared=yes \
      	makefiles

      make OPT="$CFLAGS"

      make non-interactive-package \
         install_root="${{targets.contextdir}}" \
         readme_directory=/usr/share/doc/postfix/readme \
         manpage_directory=/usr/share/man \
         command_directory=/usr/bin

      # Install qshape auxiliary script
      install -Dm644 man/man1/qshape.1 -t "${{targets.contextdir}}"/usr/share/man/man1
      install -Dm755 auxiliary/qshape/qshape.pl -t "${{targets.contextdir}}"/usr/bin

      # Set setgid bit for postqueue and postdrop (ownership handled by image level)
      chmod 2755 "${{targets.contextdir}}"/usr/bin/postqueue "${{targets.contextdir}}"/usr/bin/postdrop

      mkdir -p "${{targets.contextdir}}"/usr/share/doc/postfix/defaults/ \
        "${{targets.contextdir}}"/usr/share/licenses/postfix/
      mv "${{targets.contextdir}}"/etc/postfix/*.default \
      	"${{targets.contextdir}}"/usr/share/doc/postfix/defaults/
      mv "${{targets.contextdir}}"/etc/postfix/*LICENSE* \
      	"${{targets.contextdir}}"/usr/share/licenses/postfix/
      install -Dm755 postfix.initd "${{targets.contextdir}}"/etc/init.d/postfix

      cd "${{targets.contextdir}}"/etc/postfix/
      for map in ldap mysql pcre pgsql sqlite; do
      	_mvline "^\s*$map" "$map" dynamicmaps.cf
      done
      rm makedefs.out

      # fix /etc/postfix/postfix-files so that "postfix set-permissions" can run
      sed -i \
      	-e '/shlib_directory\/postfix-/d' \
      	-e '/meta_directory\/makedefs.out/d' \
      	-e '/manpage_directory/d' \
      	-e '/config_directory\/LICENSE/d' \
      	-e '/config_directory\/TLS_LICENSE/d' \
      	-e '/config_directory\/[^/]\+\.cf\.default/d' \
      	"${{targets.contextdir}}"/etc/postfix/postfix-files

  # Copy and customize upstream scripts and configs
  - runs: |
      # Copy scripts from upstream
      mkdir -p "${{targets.contextdir}}"/scripts
      cp -r scripts/* "${{targets.contextdir}}"/scripts/
      chmod +x "${{targets.contextdir}}"/scripts/*.sh

      # Copy configs from upstream
      mkdir -p "${{targets.contextdir}}"/etc
      cp -r configs/* "${{targets.contextdir}}"/etc/

      # Customize scripts for Rspamd instead of OpenDKIM
      cd "${{targets.contextdir}}"

      # Update supervisord.conf to use Rspamd instead of OpenDKIM
      sed -i 's/\[program:opendkim\]/\[program:rspamd\]/' etc/supervisord.conf
      sed -i 's/command.*=.*\/scripts\/opendkim.sh/command         = \/scripts\/rspamd.sh/' etc/supervisord.conf
      sed -i 's/user.*=.*opendkim/user            = _rspamd/' etc/supervisord.conf
      sed -i 's/group.*=.*opendkim/group           = _rspamd/' etc/supervisord.conf

      # Create Rspamd script (replacing opendkim.sh)
      cat > scripts/rspamd.sh << 'EOF'
      #!/bin/sh
      set -e
      exec /usr/bin/rspamd -c /etc/rspamd/rspamd.conf -f -u _rspamd -g _rspamd
      EOF
      chmod +x scripts/rspamd.sh

      # Update healthcheck.sh to check Rspamd instead of OpenDKIM
      sed -i 's/check_dkim/check_rspamd/' scripts/healthcheck.sh
      sed -i 's/printf.*8891/printf "\\x18Clocalhost\\x004\\x00\\x00127.0.0.1\\x00" | nc -w 2 127.0.0.1 11332/' scripts/healthcheck.sh
      sed -i 's/DKIM check/Rspamd check/' scripts/healthcheck.sh

      # Update common-run.sh to replace OpenDKIM functions with Rspamd
      sed -i 's/postfix_setup_dkim/postfix_setup_rspamd/' scripts/common-run.sh
      sed -i 's/opendkim_custom_commands/rspamd_custom_commands/' scripts/common-run.sh

      # Replace the OpenDKIM debugging function completely (same issue we hit before)
      # Remove the old function and add the new one
      sed -i '/postfix_setup_debugging()/,/^}/d' scripts/common-run.sh

      # Add the new Rspamd-compatible debugging function
      cat >> scripts/common-run.sh << 'EOF'

      postfix_setup_debugging() {
          if [ ! -z "$INBOUND_DEBUGGING" ]; then
              notice "Enabling additional debugging for: ${emphasis}$POSTFIX_mynetworks${reset}, as INBOUND_DEBUGGING=''${INBOUND_DEBUGGING}''"
              do_postconf -e "debug_peer_list=$POSTFIX_mynetworks"
          else
              info "Debugging is disabled."
          fi
      }
      EOF

      # Add Rspamd setup function to common-run.sh
      cat >> scripts/common-run.sh << 'EOF'

      postfix_setup_rspamd() {
          local RSPAMD_ENABLED

          if [ -d /etc/rspamd/local.d ] && [ ! -z "$(find /etc/rspamd/local.d -type f ! -name .)" ]; then
              RSPAMD_ENABLED=", ${emphasis}rspamd${reset}"
              notice "Configuring Rspamd."
              mkdir -p /var/run/rspamd
              chown -R _rspamd:_rspamd /var/run/rspamd

              do_postconf -e "milter_protocol=6"
              do_postconf -e "milter_default_action=accept"
              do_postconf -e "smtpd_milters=inet:localhost:11332"
              do_postconf -e "non_smtpd_milters=inet:localhost:11332"

              # Note: Configuration files are created at package level
              # No need to recreate them at runtime
          else
              info "No Rspamd configuration found, will not use Rspamd."
              do_postconf -# smtpd_milters
              do_postconf -# non_smtpd_milters
          fi
      }

      rspamd_custom_commands() {
          local setting
          local key
          local value
          for setting in ${!RSPAMD_*}; do
              key="${setting:7}"
              value="${!setting}"
              if [ -n "${value}" ]; then
                  info "Applying custom Rspamd setting: ${emphasis}${key}=${value}${reset}"
              else
                  info "Deleting custom Rspamd setting: ${emphasis}${key}${reset}"
              fi
          done
      }
      EOF

      # Update remaining OpenDKIM references
      sed -i 's/DKIM_ENABLED/RSPAMD_ENABLED/' scripts/run.sh
      sed -i 's/postfix_setup_dkim/postfix_setup_rspamd/g' scripts/run.sh
      sed -i 's/opendkim_custom_commands/rspamd_custom_commands/g' scripts/run.sh

      # Fix cron.sh flag
      sed -i 's/crond -f -S/crond -f/' scripts/cron.sh

      # Create configuration directories and files
      mkdir -p "${{targets.contextdir}}"/etc/rspamd/local.d "${{targets.contextdir}}"/etc/postfix/main.cf.d

      # Create Postfix milter configuration
      cat > "${{targets.contextdir}}"/etc/postfix/main.cf.d/milter.conf << 'EOF'
      # Milter configuration for rspamd integration
      smtpd_milters = inet:localhost:11332
      milter_default_action = accept
      milter_protocol = 6
      EOF

      # Create Rspamd worker-proxy override for Postfix milter
      cat > "${{targets.contextdir}}"/etc/rspamd/local.d/worker-proxy.inc << 'EOF'
      # Override worker-proxy for Postfix milter
      bind_socket = "localhost:11332";
      milter = true;
      EOF

      # Create DKIM signing configuration for Postfix mail server
      cat > "${{targets.contextdir}}"/etc/rspamd/local.d/dkim_signing.conf << 'EOF'
      # Enable DKIM signing by setting the default key path
      # This overrides the commented path in upstream dkim_signing.conf
      path = "/var/lib/rspamd/dkim/$domain.$selector.key";

      # Additional Postfix-specific DKIM settings
      # Sign authenticated users (SMTP authentication)
      sign_authenticated = true;

      # Sign local network mail
      sign_local = true;

      # Don't sign inbound mail (only outbound)
      sign_inbound = false;

      # Use domain from email header for signing
      use_domain = "header";

      # Normalize domains to eSLD (e.g., sub.example.com -> example.com)
      use_esld = true;

      # Check if public key matches private key (recommended for production)
      check_pubkey = true;

      # Allow public key mismatch (for key rotation scenarios)
      allow_pubkey_mismatch = true;
      EOF

subpackages:
  - name: postfix-doc
    pipeline:
      - uses: split/manpages
    description: postfix manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: postfix-stone
    description: Postfix simulation and testing tools
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          install -Dm755 src/fsstone/fsstone "${{targets.contextdir}}"/usr/bin/fsstone
          find src/smtpstone -mindepth 1 -perm 0755 -exec cp {} "${{targets.contextdir}}"/usr/bin \;
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - range: _subpackages
    name: postfix-${{range.key}}
    description: "${{range.key}} map support for postfix"
    dependencies:
      runtime:
        - mariadb-connector-c-dev
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib/postfix \
                 "${{targets.contextdir}}"/etc/postfix/dynamicmaps.cf.d
          m="${{range.key}}"
          mv "${{targets.destdir}}"/usr/lib/postfix/postfix-$m.so \
          	"${{targets.subpkgdir}}"/usr/lib/postfix/
          mv "${{targets.destdir}}"/etc/postfix/dynamicmaps.cf.d/$m \
          	"${{targets.subpkgdir}}"/etc/postfix/dynamicmaps.cf.d/
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: bokysan/docker-postfix
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - runs: |
        #!/bin/bash
        #create postdrop group and postfix user with unique group IDs

        addgroup -S postfix
        addgroup -S postdrop
        adduser -S -D -H -h /dev/null -s /sbin/nologin -G postfix postfix
        chown -R postfix:postdrop /var/spool/postfix
        chmod -R 755 /var/spool/postfix

        # Fix ownership of /var/spool/postfix and its subdirectories
        chown root:root /var/spool/postfix
        chown root:root /var/spool/postfix/pid

        # Fix ownership of /var/lib/postfix
        chown -R postfix:postfix /var/lib/postfix

        # Fix ownership and permissions of postqueue and postdrop executables
        chown root:postdrop /usr/bin/postqueue /usr/bin/postdrop
        chmod 2755 /usr/bin/postqueue /usr/bin/postdrop

        set +e
        postfix -v start
        set -e

        postfix check
        postfix status

        echo "Checking Postfix mail queue..."
        mailq

        LOG_FILE="/var/log/maillog"
        if [ -f "$LOG_FILE" ]; then
            echo "Checking Postfix logs for email delivery status..."
            grep "$(date +'%b %d')" $LOG_FILE | tail -n 10
        else
            echo "Log file not found: $LOG_FILE"
        fi

        TO_EMAIL="localuser@localhost"
        FROM_EMAIL="testuser@localhost"
        SUBJECT="Postfix Test Email"
        BODY="This is a test email sent via Postfix to verify functionality."

        EMAIL_CONTENT="From: $FROM_EMAIL\nTo: $TO_EMAIL\nSubject: $SUBJECT\n\n$BODY"

        echo -e "$EMAIL_CONTENT" | /usr/bin/sendmail -t

        sleep 3

        MAIL_QUEUE=$(mailq)

        if [ -z "$MAIL_QUEUE" ]; then
            echo "Postfix test successful: Mail queue is empty. Email was likely delivered."
        else
            echo "Postfix test result: Mail queue is not empty. Here is the current queue:"
            echo "$MAIL_QUEUE"
        fi

        echo "Test complete."