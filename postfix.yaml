  - name: postfix-rspamd-config
    description: Rspamd configuration for Postfix DKIM signing
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
        - rspamd
        - bash
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/etc/opendkim
          mkdir -p "${{targets.subpkgdir}}"/etc/rspamd/local.d
          
          # Create placeholder opendkim.conf for compatibility with upstream
          cat > "${{targets.subpkgdir}}"/etc/opendkim/opendkim.conf << 'EOF'
          # OpenDKIM configuration (using rspamd instead)
          # This file is kept for compatibility with upstream
          # Rspamd handles DKIM signing and verification
          
          # Settings from upstream that rspamd will handle:
          AutoRestart             Yes
          AutoRestartRate         10/1h
          UMask                   002
          Syslog                  Yes
          SyslogSuccess           Yes
          LogWhy                  No
          
          Canonicalization        relaxed/simple
          RequireSafeKeys         no
          
          Mode                    sv
          SignatureAlgorithm      rsa-sha256
          EOF
          
          # Create rspamd DKIM signing configuration
          cat > "${{targets.subpkgdir}}"/etc/rspamd/local.d/dkim_signing.conf << 'EOF'
          # DKIM signing configuration for use with Postfix
          path = "/etc/rspamd/dkim/$domain.$selector.key";
          selector = "mail";
          allow_username_mismatch = true;
          use_domain = "header";
          use_esld = true;
          sign_local = true;
          sign_authenticated = true;
          EOF
          
          # Create milter configuration for Postfix integration
          cat > "${{targets.subpkgdir}}"/etc/rspamd/local.d/milter_headers.conf << 'EOF'
          # Add DKIM signature using the milter protocol
          use = ["authentication-results", "x-spam-status"];
          authenticated_headers = ["authentication-results"];
          EOF
          
          # Create worker-proxy configuration for Postfix milter
          cat > "${{targets.subpkgdir}}"/etc/rspamd/local.d/worker-proxy.inc << 'EOF'
          bind_socket = "localhost:8891";
          milter = true;
          EOF

  - range: _subpackages
    name: postfix-${{range.key}}
    description: "${{range.key}} map support for postfix"
    dependencies:
      runtime:
        - mariadb-11.8-dev
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib/postfix \
                 "${{targets.contextdir}}"/etc/postfix/dynamicmaps.cf.d
          m="${{range.key}}"
          mkdir -p "${{targets.contextdir}}"/usr/lib/postfix \
                 "${{targets.contextdir}}"/etc/postfix/dynamicmaps.cf.d
          mv "${{targets.destdir}}"/usr/lib/postfix/postfix-$m.so \
          	"${{targets.subpkgdir}}"/usr/lib/postfix/
          mv "${{targets.destdir}}"/etc/postfix/dynamicmaps.cf.d/$m \
          	"${{targets.subpkgdir}}"/etc/postfix/dynamicmaps.cf.d/
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  release-monitor:
    identifier: 3693

test:
  pipeline:
    - runs: |
        #!/bin/bash
        #create postdrop group and postfix user with unique group IDs

        addgroup -S postfix
        addgroup -S postdrop
        adduser -S -D -H -h /dev/null -s /sbin/nologin -G postfix postfix
        chown -R postfix:postdrop /var/spool/postfix
        chmod -R 755 /var/spool/postfix

        # Fix ownership of /var/spool/postfix and its subdirectories
        chown root:root /var/spool/postfix
        chown root:root /var/spool/postfix/pid

        # Fix ownership of /var/lib/postfix
        chown -R postfix:postfix /var/lib/postfix

        # Fix ownership and permissions of postqueue and postdrop executables
        chown root:postdrop /usr/bin/postqueue /usr/bin/postdrop
        chmod 2755 /usr/bin/postqueue /usr/bin/postdrop

        set +e
        postfix -v start
        set -e

        postfix check
        postfix status

        echo "Checking Postfix mail queue..."
        mailq

        LOG_FILE="/var/log/maillog"
        if [ -f "$LOG_FILE" ]; then
                    echo "Checking Postfix logs for email delivery status..."
                        grep "$(date +'%b %d')" $LOG_FILE | tail -n 10
                else
                            echo "Log file not found: $LOG_FILE"
        fi

        TO_EMAIL="localuser@localhost"
        FROM_EMAIL="testuser@localhost"
        SUBJECT="Postfix Test Email"
        BODY="This is a test email sent via Postfix to verify functionality."

        EMAIL_CONTENT="From: $FROM_EMAIL\nTo: $TO_EMAIL\nSubject: $SUBJECT\n\n$BODY"

        echo -e "$EMAIL_CONTENT" | /usr/bin/sendmail -t

        sleep 3

        MAIL_QUEUE=$(mailq)

        if [ -z "$MAIL_QUEUE" ]; then
                    echo "Postfix test successful: Mail queue is empty. Email was likely delivered."
            else
                        echo "Postfix test result: Mail queue is not empty. Here is the current queue:"
                            echo "$MAIL_QUEUE"
        fi

        echo "Test complete."
